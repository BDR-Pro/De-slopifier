name: Test and build
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Test and build
        run: |
          for file in src/*.js; do node --check "$file"; done
          node --test tests/test_*.cjs
          python -m unittest discover -s tests -p 'test_tooling*.py' -v
          python build.py
      - name: Lint Firefox extension
        run: |
          npm install --global web-ext@10.5.0 --ignore-scripts
          web-ext lint --source-dir dist/firefox
      - name: Test Chromium fixtures and UI
        run: |
          python -m pip install -r requirements-test.txt
          python -m playwright install --with-deps chromium
          python tests/test_browser.py
          python tests/test_sync_ui.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: fixture-results
          path: |
            tests/browser-results.json
            tests/*preview.png
          if-no-files-found: ignore
          retention-days: 7
