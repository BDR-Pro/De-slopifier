name: Publish Firefox Add-ons
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing numbered release tag (not rolling)
        required: true
        type: string
        default: v0.1.0
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
    secrets:
      AMO_JWT_ISSUER:
        required: false
      AMO_JWT_SECRET:
        required: false
permissions:
  contents: read
concurrency:
  group: firefox-store-publishing
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: firefox-add-ons
    timeout-minutes: 15
    steps:
      - name: Validate numbered tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: '[[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Verify release and build
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python scripts/check_release.py
          python build.py
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install Mozilla tool and lint
        run: |
          npm install --global web-ext@10.5.0 --ignore-scripts
          web-ext lint --source-dir dist/firefox
      - name: Submit listed add-on and matching source
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          test -n "$WEB_EXT_API_KEY" || { echo 'Missing AMO_JWT_ISSUER'; exit 1; }
          test -n "$WEB_EXT_API_SECRET" || { echo 'Missing AMO_JWT_SECRET'; exit 1; }
          web-ext sign --source-dir dist/firefox --channel listed \
            --amo-metadata store/firefox-metadata.json \
            --upload-source-code dist/release/*-source.zip \
            --approval-timeout 0 --timeout 300000
          echo 'Submitted; review and signing are separate. This does not confirm public availability.' >> "$GITHUB_STEP_SUMMARY"
